services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mwdgym-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8081}:8081"
    environment:
      - PORT=8080
      - DB_URL=jdbc:mysql://host.docker.internal:3306/${DB_NAME:-mwdgymdb}?createDatabaseIfNotExist=true
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-US@i1234}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads_data:/app/uploads

volumes:
  uploads_data:
