spring.application.name=mwdgym
server.port=${PORT:8080}

# CORS: accept all origins by default (handles DHCP / VPS IP changes).
# Override via CORS_ALLOWED_ORIGINS env var if you need to restrict.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# MySQL configured via system environment variables
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# File upload limits
spring.servlet.multipart.max-file-size=512MB
spring.servlet.multipart.max-request-size=520MB